<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เลือกแพ็กเกจเว็บไซต์</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230f4c30%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2716%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Arial%27 font-weight=%27700%27%3E%E0%B8%BF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: configurator — step 1 price ladder, step 2 add-ons, step 3 hosting; sticky summary on the right (bottom bar on phones) */
:root {
  --bg: #f6f7f4;
  --surface: #ffffff;
  --ink: #14201a;
  --ink-2: #44514a;
  --mute: #6f7a73;
  --line: #dde2db;
  --brand: #0f4c30;
  --brand-2: #1b7047;
  --brand-soft: #e7f0ea;
  --on-brand: #ffffff;
  --gold: #9a6f12;
  --gold-soft: #fbf3df;
  --warn: #9b3b1e;
  --warn-soft: #fbe9e3;
  --font-th: 'IBM Plex Sans Thai', 'Leelawadee UI', 'Noto Sans Thai', sans-serif;
  --font-num: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1512; --surface: #18221c; --ink: #e9efea; --ink-2: #c2ccc5; --mute: #8f9b94; --line: #2a362f;
    --brand: #7fd0a2; --brand-2: #9ee0b8; --brand-soft: #1d2d24; --on-brand: #0c1a12; --gold: #e2b65a; --gold-soft: #2b2416;
    --warn: #f0a185; --warn-soft: #2e1c16;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-th); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 80px max(16px, env(safe-area-inset-left, 0px)); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; border-radius: 4px; }

.langbar { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 14px; background: var(--surface); }
.langbar button { border: 0; background: transparent; padding: 6px 14px; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.langbar button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
@media print { .langbar { display: none !important; } }
/* Header */
header.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; margin-bottom: 28px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--brand-2); }
header.top h1 { font-size: clamp(26px, 4vw, 40px); line-height: 1.2; margin-top: 6px; }
header.top p { margin: 8px 0 0; color: var(--ink-2); max-width: 66ch; }
.from { text-align: right; }
.from .k { font-size: 13px; color: var(--mute); }
.from .v { font-size: clamp(34px, 5vw, 52px); font-weight: 700; color: var(--brand); line-height: 1; }
.from .v small { font-size: 16px; color: var(--ink-2); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
.step { margin-bottom: 30px; }
.step-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.step-h .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: var(--on-brand); font-size: 13px; font-weight: 700; flex: none; }
.step-h h2 { font-size: 20px; }
.step-h span.hint { color: var(--mute); font-size: 13px; }

/* Step 1 — levels */
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.lvl { text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; transition: border-color .15s, transform .15s; }
.lvl:hover { border-color: var(--brand-2); transform: translateY(-1px); }
.lvl[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand); }
.lvl .p { font-size: 22px; font-weight: 700; color: var(--brand); line-height: 1.15; }
.lvl .p small { font-size: 12px; color: var(--mute); font-weight: 500; }
.lvl .name { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--mute); }
.lvl ul { margin: 2px 0 0; padding-left: 16px; font-size: 12.5px; color: var(--ink-2); }
.lvl .w { font-size: 12px; color: var(--mute); margin-top: auto; padding-top: 4px; }

/* Step 2 — add-ons */
.group { margin-bottom: 16px; }
.group h3 { font-size: 13px; font-weight: 700; letter-spacing: .05em; color: var(--mute); margin-bottom: 6px; }
.items { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.item { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; padding: 12px 14px; align-items: center; }
.item + .item { border-top: 1px solid var(--line); }
.item.on { background: color-mix(in oklab, var(--brand-soft) 70%, transparent); }
.item.base { background: var(--brand-soft); }
.thumb { width: 64px; height: 44px; border-radius: 6px; border: 1px solid var(--line); object-fit: cover; object-position: top; background: var(--bg); display: block; }
.ph { width: 64px; height: 44px; border-radius: 6px; border: 1px dashed var(--line); display: grid; place-items: center; color: var(--mute); }
.item .t { font-weight: 600; }
.item .d { font-size: 13px; color: var(--ink-2); }
.item .req { font-size: 12px; color: var(--mute); }
.item .price { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.item .price b { color: var(--brand); }
.ctl { display: flex; align-items: center; gap: 8px; justify-self: end; }
.toggle { position: relative; width: 46px; height: 26px; border-radius: 999px; background: var(--line); border: 0; cursor: pointer; flex: none; transition: background .15s; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.toggle[aria-checked="true"] { background: var(--brand); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.stepper button { width: 32px; height: 32px; border: 0; background: transparent; cursor: pointer; font-size: 18px; line-height: 1; color: var(--brand); }
.stepper button:disabled { color: var(--line); cursor: default; }
.stepper input { width: 46px; height: 32px; border: 0; border-inline: 1px solid var(--line); text-align: center; font: 600 14px var(--font-num); background: transparent; color: var(--ink); -moz-appearance: textfield; }
.stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.free { font-size: 12px; font-weight: 700; color: var(--brand-2); background: var(--brand-soft); padding: 3px 8px; border-radius: 6px; }

/* Step 3 — hosting */
.hosts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.host { text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.host[aria-checked="true"] { border-color: var(--brand); background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand); }
.host:disabled { opacity: .5; cursor: not-allowed; }
.host .nm { font-weight: 700; }
.host .p { font-size: 22px; font-weight: 700; color: var(--brand); line-height: 1.1; }
.host .p small { font-size: 12px; color: var(--mute); font-weight: 500; }
.host ul { margin: 0; padding-left: 16px; font-size: 12.5px; color: var(--ink-2); }
.host .why { font-size: 12px; color: var(--warn); }
.must { margin: 10px 0 0; font-size: 13.5px; padding: 10px 12px; border-radius: 8px; background: var(--gold-soft); color: var(--ink); border-left: 3px solid var(--gold); }
.step .must { margin: 0 0 12px; }
.notice { margin-top: 10px; font-size: 13px; padding: 8px 12px; border-radius: 8px; background: var(--gold-soft); color: var(--gold); }

/* Summary */
.summary { position: sticky; top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.sum-top { background: var(--brand); color: var(--on-brand); padding: 18px 20px; }
.sum-top .k { font-size: 12px; font-weight: 600; letter-spacing: .06em; opacity: .85; }
.sum-top .v { font-size: 34px; font-weight: 700; line-height: 1.15; }
.sum-top .s { font-size: 13px; opacity: .9; }
.sum-body { padding: 16px 20px; display: grid; gap: 12px; }
.sum-body h3 { font-size: 13px; color: var(--mute); letter-spacing: .05em; }
.lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13px; }
.lines li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
.lines li span:first-child { color: var(--ink-2); }
.lines.scroll { max-height: 260px; overflow-y: auto; padding-right: 4px; }
.tot { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.tot dt { color: var(--ink-2); }
.tot dd { margin: 0; text-align: right; font-weight: 600; }
.tot .grand dt, .tot .grand dd { font-weight: 700; font-size: 16px; color: var(--ink); }
.tot .grand { display: contents; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { cursor: pointer; border-radius: 8px; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--brand-2); }
.btn.primary { grid-column: 1 / -1; background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.toast { font-size: 13px; color: var(--brand-2); min-height: 1.3em; }
.foot { margin-top: 24px; font-size: 12px; color: var(--mute); }

/* Phone bottom bar */
.bar { display: none; }
@media (max-width: 980px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .summary { position: static; }
  .hosts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; justify-content: space-between; align-items: center; gap: 12px;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -10px 30px -20px rgba(0,0,0,.4); }
  .bar .v { font-size: 20px; font-weight: 700; color: var(--brand); }
  .bar .k { font-size: 12px; color: var(--mute); }
  .bar .btn { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
  .wrap { padding-bottom: 120px; }
}
@media (max-width: 560px) {
  header.top { grid-template-columns: minmax(0, 1fr); }
  .from { text-align: left; }
  .hosts { grid-template-columns: minmax(0, 1fr); }
  .item { grid-template-columns: minmax(0, 1fr) auto; }
  .thumb, .ph { display: none; }
}

/* Print / PDF: the summary only */
@media print {
  body { background: #fff; color: #000; }
  header.top .from, .layout > div:first-child, .bar, .actions, .toast { display: none !important; }
  .layout { display: block; }
  .summary { border: 0; position: static; }
  .sum-top { background: #fff; color: #000; border-bottom: 2px solid #000; padding-inline: 0; }
  .sum-body { padding-inline: 0; }
  .lines.scroll { max-height: none; overflow: visible; }
  #print-head { display: block !important; }
}
#print-head { display: none; margin-bottom: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="langbar" role="group" aria-label="Language / ภาษา">
        <button type="button" data-lang="th" aria-pressed="true">ไทย</button><button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
      <div class="eyebrow" data-i="eyebrow"></div>
      <h1 data-i="h1"></h1>
      <p data-i="intro"></p>
      <p class="must" data-i="must1" data-html></p>
    </div>
    <div class="from">
      <div class="k" data-i="fromK"></div>
      <div class="v num">5,000 <small data-i="baht"></small></div>
      <div class="k" data-i="fromNote"></div>
    </div>
  </header>

  <div class="layout">
    <div>
      <section class="step" aria-labelledby="s1">
        <div class="step-h"><span class="n">1</span><h2 id="s1" data-i="s1"></h2><span class="hint" data-i="s1h"></span></div>
        <div class="levels" id="levels"></div>
      </section>

      <section class="step" aria-labelledby="s2">
        <div class="step-h"><span class="n">2</span><h2 id="s2" data-i="s2"></h2><span class="hint" data-i="s2h"></span></div>
        <div id="groups"></div>
      </section>

      <section class="step" aria-labelledby="s3">
        <div class="step-h"><span class="n">3</span><h2 id="s3">Hosting + Domain + SSL</h2><span class="hint" data-i="s3h"></span></div>
        <p class="must" data-i="must3" data-html></p>
        <div class="hosts" id="hosts" role="radiogroup" aria-label="Hosting"></div>
        <div class="notice" id="host-note" hidden></div>
      </section>
    </div>

    <aside class="summary" id="summary" aria-live="polite">
      <div class="sum-top">
        <div id="print-head"><b data-i="printHead"></b></div>
        <div class="k" data-i="firstYear"></div>
        <div class="v num" id="grand"></div>
        <div class="s" id="match"></div>
      </div>
      <div class="sum-body">
        <h3 data-i="selected"></h3>
        <ul class="lines scroll" id="lines"></ul>
        <dl class="tot">
          <dt data-i="dev"></dt><dd class="num" id="t-dev"></dd>
          <dt id="t-host-l"></dt><dd class="num" id="t-host"></dd>
          <dt id="t-care-l"></dt><dd class="num" id="t-care"></dd>
          <div class="grand"><dt data-i="grandL"></dt><dd class="num" id="t-grand"></dd></div>
          <dt data-i="renewL"></dt><dd class="num" id="t-renew"></dd>
        </dl>
        <dl class="tot">
          <dt data-i="weeksL"></dt><dd id="weeks"></dd>
          <dt id="p1L"></dt><dd class="num" id="p1"></dd>
          <dt id="p2L"></dt><dd class="num" id="p2"></dd>
          <dt id="p3L" hidden></dt><dd class="num" id="p3" hidden></dd>
        </dl>
        <p class="must" id="own-host" data-i="ownHost" hidden></p>
        <div class="actions">
          <button class="btn primary" type="button" id="preview" data-i="preview"></button>
          <button class="btn" type="button" id="copy" style="grid-column: 1 / -1" data-i="copy"></button>
          <button class="btn" type="button" id="share" data-i="share"></button>
          <button class="btn" type="button" id="print" data-i="print"></button>
          <button class="btn" type="button" id="reset" style="grid-column: 1 / -1" data-i="reset"></button>
        </div>
        <div class="toast" id="toast" role="status"></div>
      </div>
    </aside>
  </div>

  <p class="foot" data-i="foot"></p>
</div>

<div class="bar">
  <div><div class="k" data-i="firstYear"></div><div class="v num" id="bar-total"></div></div>
  <div style="display:flex;gap:8px"><button class="btn" type="button" id="preview-m" data-i="previewM"></button><button class="btn" type="button" id="to-summary" data-i="toSummary" style="background:var(--surface);color:var(--ink);border-color:var(--line)"></button></div>
</div>

<script src="preview.js"></script>
<script>

  function setQty(id, n) {
    const it = byId[id];
    n = Math.max(0, Math.min(it.max, Math.round(n || 0)));
    qty[id] = n;
    if (n > 0) (it.req || []).forEach((r) => qty[r] === 0 && setQty(r, 1));
    if (n === 0) ITEMS.filter((d) => (d.req || []).includes(id) && qty[d.id] > 0).forEach((d) => setQty(d.id, 0));
  }

  /* ─────────── Render (language-dependent parts) ─────────── */
  const weeksFor = (q) => Math.max(1, Math.ceil((BASE.days + ITEMS.reduce((s, i) => s + i.days * (q[i.id] || 0), 0)) / 5));
  const thumb = (src) => src ? `<img class="thumb" src="${src}" alt="" loading="lazy">` : '<span class="ph" aria-hidden="true">+</span>';

  function renderStatic() {
    const t = ui();
    document.documentElement.lang = lang;
    document.title = lang === 'en' ? 'Website Package Builder' : 'เลือกแพ็กเกจเว็บไซต์';
    document.querySelectorAll('[data-i]').forEach((el) => {
      const v = t[el.dataset.i];
      if (typeof v !== 'string') return;
      if (el.hasAttribute('data-html')) el.innerHTML = v; else el.textContent = v;
    });
    document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));

    $('levels').innerHTML = LEVELS.map((l, idx) => `
      <button class="lvl" type="button" data-level="${idx}" aria-pressed="false">
        <span class="name">${t.level(idx + 1)}</span>
        <span class="p num">${fmt(l.price)} <small>${t.baht}</small></span>
        <ul>${tr(l.add).map((a) => `<li>${a}</li>`).join('')}</ul>
        <span class="w">${t.about(weeksFor(l.qty))}</span>
      </button>`).join('');

    $('groups').innerHTML =
      `<div class="group"><h3>${t.included}</h3><div class="items">
        <div class="item base">${thumb(BASE.img)}
          <div><div class="t">${tr(BASE.t)}</div><div class="d">${tr(BASE.d)}</div><div class="price"><b class="num">${fmt(BASE.price)}</b> ${t.baht}</div></div>
          <span class="free">${t.inc}</span></div></div></div>` +
      Object.keys(G).map((g) => `<div class="group"><h3>${tr(G[g])}</h3><div class="items">${ITEMS.filter((i) => i.g === g).map((i) => `
        <div class="item" id="row-${i.id}">
          ${thumb(i.img)}
          <div>
            <div class="t">${tr(i.t)}</div>
            <div class="d">${tr(i.d)}</div>
            ${i.req ? `<div class="req">${t.needs}${i.req.map((r) => tr(byId[r].t)).join(', ')}</div>` : ''}
            <div class="price"><b class="num">${fmt(i.price)}</b> ${t.baht}${i.unit ? ` / ${unit(i, 1)}` : ''}</div>
          </div>
          <div class="ctl">${i.max === 1
            ? `<button class="toggle" type="button" role="switch" aria-checked="false" data-toggle="${i.id}" aria-label="${tr(i.t)}"></button>`
            : `<div class="stepper"><button type="button" data-dec="${i.id}" aria-label="− ${tr(i.t)}">−</button><input id="q-${i.id}" data-qty="${i.id}" type="number" inputmode="numeric" min="0" max="${i.max}" step="${i.step || 1}" value="0" aria-label="${tr(i.t)}"><button type="button" data-inc="${i.id}" aria-label="+ ${tr(i.t)}">+</button></div>`}
          </div>
        </div>`).join('')}</div></div>`).join('');

    $('hosts').innerHTML = HOSTS.map((h) => `
      <button class="host" type="button" role="radio" aria-checked="false" data-host="${h.id}">
        <span class="nm">${tr(h.name)}</span>
        <span class="p num">${fmt(h.price)} <small>${h.price ? t.perYear : t.baht}</small></span>
        <ul>${tr(h.feats).map((f) => `<li>${f}</li>`).join('')}</ul>
        ${h.noCms ? `<span class="why" hidden id="why-basic">${t.notCms}</span>` : ''}
      </button>`).join('');
  }

  /* ─────────── Update ─────────── */
  function calc() {
    const chosen = ITEMS.filter((i) => qty[i.id] > 0);
    const dev = BASE.price + chosen.filter((i) => !i.recurring).reduce((s, i) => s + i.price * qty[i.id], 0);
    const care = chosen.filter((i) => i.recurring).reduce((s, i) => s + i.price * qty[i.id], 0);
    const h = HOSTS.find((x) => x.id === host);
    const days = BASE.days + chosen.reduce((s, i) => s + i.days * qty[i.id], 0);
    const level = [...LEVELS].reverse().find((l) => ITEMS.every((i) => (l.qty[i.id] || 0) === qty[i.id]));
    const below = [...LEVELS].reverse().find((l) => ITEMS.every((i) => (l.qty[i.id] || 0) <= qty[i.id]));
    return { chosen, dev, care, h, days, weeks: Math.max(1, Math.ceil(days / 5)), level, below, grand: dev + care + h.price };
  }
  const line = (i) => `${tr(i.t)}${i.max > 1 ? ` × ${qty[i.id]} ${unit(i, qty[i.id])}` : ''}`;

  function update() {
    const t = ui();
    const basicBtn = document.querySelector('[data-host="basic"]');
    basicBtn.disabled = qty.cms > 0;
    $('why-basic').hidden = !(qty.cms > 0);
    if (qty.cms > 0 && host === 'basic') { host = 'standard'; hostAuto = true; }
    $('host-note').hidden = !hostAuto;
    $('host-note').textContent = hostAuto ? t.autoStd : '';

    const c = calc();
    ITEMS.forEach((i) => {
      $('row-' + i.id).classList.toggle('on', qty[i.id] > 0);
      if (i.max === 1) document.querySelector(`[data-toggle="${i.id}"]`).setAttribute('aria-checked', String(qty[i.id] > 0));
      else {
        $('q-' + i.id).value = qty[i.id];
        document.querySelector(`[data-dec="${i.id}"]`).disabled = qty[i.id] === 0;
        document.querySelector(`[data-inc="${i.id}"]`).disabled = qty[i.id] >= i.max;
      }
    });
    document.querySelectorAll('[data-level]').forEach((b) => b.setAttribute('aria-pressed', String(LEVELS[b.dataset.level] === c.level)));
    document.querySelectorAll('[data-host]').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.host === host)));

    const hn = tr(c.h.name);
    $('lines').innerHTML = [`<li><span>${t.baseLine(tr(BASE.t))}</span><span class="num">${fmt(BASE.price)}</span></li>`,
      ...c.chosen.map((i) => `<li><span>${line(i)}</span><span class="num">${fmt(i.price * qty[i.id])}</span></li>`),
      ...(c.h.price ? [`<li><span>${t.hostLine(hn)}</span><span class="num">${fmt(c.h.price)}</span></li>`] : []),
    ].join('');
    $('t-dev').textContent = fmt(c.dev);
    $('t-host').textContent = fmt(c.h.price);
    $('t-host-l').textContent = c.h.price ? t.hostL(hn) : t.hostOwn;
    $('own-host').hidden = c.h.price > 0;
    $('t-care').textContent = fmt(c.care);
    $('t-care-l').textContent = t.careL(qty.monthly);
    $('t-care-l').hidden = $('t-care').hidden = !qty.monthly;
    $('t-grand').textContent = fmt(c.grand);
    $('t-renew').textContent = c.h.price ? t.renew(fmt(c.h.price)) : '—';
    $('grand').textContent = `${fmt(c.grand)} ${t.baht}`;
    $('bar-total').textContent = `${fmt(c.grand)} ${t.baht}`;
    $('match').textContent = c.level ? t.match(fmt(c.level.price), c.h.price) : c.below ? t.below(fmt(c.below.price)) : t.custom;
    $('weeks').textContent = t.weeks(c.weeks);
    const half = Math.round(c.dev * 0.5);
    $('p1L').textContent = t.p1L(c.h.price > 0); $('p1').textContent = fmt(half + c.h.price);
    $('p2L').textContent = t.p2L; $('p2').textContent = fmt(c.dev - half);
    $('p3L').textContent = t.p3L; $('p3').textContent = t.perMonth(fmt(byId.monthly.price));
    $('p3L').hidden = $('p3').hidden = !qty.monthly;

    // Shareable link: #ui=en&page=4&cms=1&h=standard (ui = page language, lang = extra languages)
    const parts = [`ui=${lang}`, ...ITEMS.filter((i) => qty[i.id] > 0).map((i) => `${i.id}=${qty[i.id]}`), `h=${host}`];
    try { history.replaceState(null, '', '#' + parts.join('&')); } catch {}
  }

  function applyLevel(idx) {
    ITEMS.forEach((i) => (qty[i.id] = 0));
    Object.entries(LEVELS[idx].qty).forEach(([id, n]) => (qty[id] = n));
    hostAuto = false;
    update();
  }

  function setLang(l) {
    lang = l === 'en' ? 'en' : 'th';
    try { localStorage.setItem('pricing-lang', lang); } catch {}
    renderStatic();
    update();
  }

  /* ─────────── Events ─────────── */
  document.addEventListener('click', (e) => {
    const lb = e.target.closest('[data-lang]');
    if (lb) return setLang(lb.dataset.lang);
    const t = e.target.closest('[data-level],[data-toggle],[data-inc],[data-dec],[data-host]');
    if (!t) return;
    if (t.dataset.level) return applyLevel(+t.dataset.level);
    if (t.dataset.host) { host = t.dataset.host; hostAuto = false; return update(); }
    const id = t.dataset.toggle || t.dataset.inc || t.dataset.dec;
    const it = byId[id];
    if (t.dataset.toggle) setQty(id, qty[id] ? 0 : 1);
    if (t.dataset.inc) setQty(id, qty[id] + (it.step || 1));
    if (t.dataset.dec) setQty(id, qty[id] - (it.step || 1));
    update();
  });
  document.addEventListener('change', (e) => {
    const id = e.target.dataset?.qty;
    if (!id) return;
    setQty(id, parseInt(e.target.value, 10));
    update();
  });

  function summaryText() {
    const t = ui();
    const c = calc();
    const hn = tr(c.h.name);
    return [
      t.sumTitle,
      c.level ? t.sumLevel(fmt(c.level.price)) : '',
      '',
      `- ${tr(BASE.t)} ${t.sumBase}: ${fmt(BASE.price)} ${t.baht}`,
      ...c.chosen.map((i) => `- ${line(i)}: ${fmt(i.price * qty[i.id])} ${t.baht}`),
      '',
      t.sumDev(fmt(c.dev)),
      c.h.price ? t.sumHost(hn, fmt(c.h.price)) : t.sumOwn,
      c.care ? t.sumCare(qty.monthly, fmt(c.care)) : '',
      t.sumGrand(fmt(c.grand)),
      t.sumWeeks(c.weeks),
      t.sumP1(fmt(Math.round(c.dev * 0.5) + c.h.price), c.h.price > 0),
      t.sumP2(fmt(c.dev - Math.round(c.dev * 0.5))),
      '',
      t.sumLink + location.href,
    ].filter((l, i, a) => l !== '' || a[i - 1] !== '').join('\n');
  }
  async function copy(text, okMsg) {
    try { await navigator.clipboard.writeText(text); $('toast').textContent = okMsg; }
    catch { $('toast').textContent = ui().copyFail; prompt?.('', text); }
  }
  $('copy').addEventListener('click', () => copy(summaryText(), ui().copyOk));
  $('share').addEventListener('click', () => copy(location.href, ui().linkOk));
  $('print').addEventListener('click', () => window.print());
  $('reset').addEventListener('click', () => { host = 'basic'; applyLevel(0); $('toast').textContent = ''; });
  $('to-summary').addEventListener('click', () => $('summary').scrollIntoView({ behavior: 'smooth' }));
  const openPreview = () => {
    if (!window.WebPreview) { $('toast').textContent = ui().previewFail; return; }
    const t = ui();
    const c = calc();
    const labels = [t.chipPages(1 + qty.page), t.chipLangs(2 + qty.lang),
      ...c.chosen.filter((i) => !['page', 'lang'].includes(i.id)).map((i) => tr(i.t) + (i.max > 1 ? ` × ${qty[i.id]}` : '')),
      c.h.price ? `Hosting ${tr(c.h.name)}` : t.chipOwn];
    window.WebPreview.open({ qty: { ...qty }, hostName: c.h.price ? tr(c.h.name) : '', labels, lang });
  };
  $('preview').addEventListener('click', openPreview);
  $('preview-m').addEventListener('click', openPreview);

  /* ─────────── Start: language + selection from the link ─────────── */
  const params = new URLSearchParams(location.hash.slice(1));
  let saved = null;
  try { saved = localStorage.getItem('pricing-lang'); } catch {}
  lang = params.get('ui') || saved || ((navigator.language || '').toLowerCase().startsWith('th') ? 'th' : 'en');
  if (lang !== 'en') lang = 'th';
  renderStatic();
  const keys = [...params.keys()].filter((k) => k !== 'ui');
  if (keys.length) {
    params.forEach((v, k) => {
      if (k === 'h' && HOSTS.some((h) => h.id === v)) host = v;
      else if (k !== 'ui' && byId[k]) setQty(k, parseInt(v, 10));
    });
    update();
  } else {
    applyLevel(0);
  }
})();
</script>
</body>
</html>
